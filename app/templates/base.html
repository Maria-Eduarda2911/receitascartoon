<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Receitas Toon{% endblock %}</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Trebuchet MS",Arial,sans-serif;background:#fff8e7;color:#2d2a32;margin:0}
  header{background:#ff6b6b;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header a{color:#fff;text-decoration:none}
  header h1{margin:0;font-size:26px}
  nav a{margin-left:14px;font-weight:bold}
  main{max-width:980px;margin:20px auto;padding:0 15px}
  .busca{display:flex;gap:8px;margin-bottom:14px}
  .busca input{flex:1;padding:10px;border:2px solid #ffd166;border-radius:8px;font-size:16px}
  button,.btn{background:#ff6b6b;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{padding:6px 12px;border-radius:20px;background:#fff;border:2px solid #ffd166;color:#2d2a32;text-decoration:none;font-size:14px}
  .chip.ativo{background:#ffd166;font-weight:bold}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px #0002;text-decoration:none;color:inherit;display:block}
  .card .topo{padding:18px;font-size:44px;text-align:center}
  .card .corpo{padding:14px}
  .card h3{margin:0 0 6px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eee;margin-right:4px}
  .caixa{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 6px #0002}
  .meta{margin:10px 0}
  li{margin-bottom:6px}
  label{display:block;margin-top:12px;font-weight:bold}
  input[type=text],input[type=number],select,textarea{width:100%;padding:9px;border:2px solid #ffd166;border-radius:8px;font-size:15px;font-family:inherit}
  footer{text-align:center;font-size:12px;color:#7a7480;padding:25px 10px}
</style>
</head>
<body>
<header>
  <a href="/"><h1>🍳 Receitas Toon</h1></a>
  <nav><a href="/">Catálogo</a><a href="/nova">+ Nova receita</a></nav>
</header>
<main>
{% block conteudo %}{% endblock %}
</main>
<footer>
  Atendido pelo pod: <b>{{ pod }}</b><br>
  Projeto acadêmico, sem fins comerciais. Receitas inspiradas em desenhos animados;
  os personagens pertencem aos seus respectivos donos.
</footer>
</body>
</html>
