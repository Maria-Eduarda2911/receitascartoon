<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Receitas Toon{% endblock %}</title>
<meta name="description" content="Receitas de pratos que aparecem em desenhos animados, com a cena do episódio.">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<header class="topo">
  <div class="topo-in">
    <a class="logo" href="/">Receitas Toon</a>
    <nav class="nav" aria-label="Principal">
      <a href="/"{% if request.path == '/' %} aria-current="page"{% endif %}>Catálogo</a>
      <a class="nav-acao" href="/nova"{% if request.path == '/nova' %} aria-current="page"{% endif %}>Nova receita</a>
    </nav>
  </div>
</header>
<main id="conteudo" class="pagina">
{% block conteudo %}{% endblock %}
</main>
<footer class="rodape">
  <div class="rodape-in">
    <p>Atendido pelo pod <b>{{ pod }}</b></p>
    <p>Projeto acadêmico, sem fins comerciais. Receitas inspiradas em desenhos animados; personagens e imagens pertencem aos seus respectivos donos.</p>
  </div>
</footer>
</body>
</html>
