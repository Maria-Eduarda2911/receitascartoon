# Para testar so com Docker (sem Kubernetes): docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: receitas
      POSTGRES_USER: receitas
      POSTGRES_PASSWORD: receitas123
    volumes:
      - dados-receitas:/var/lib/postgresql/data

  web:
    build: ./app
    environment:
      DB_HOST: db
    ports:
      - "8080:5000"
    depends_on:
      - db

volumes:
  dados-receitas:
