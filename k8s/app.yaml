apiVersion: v1
kind: ConfigMap
metadata:
  name: receitas-config
data:
  DB_HOST: postgres
  DB_NAME: receitas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receitas-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: receitas-web
  template:
    metadata:
      labels:
        app: receitas-web
    spec:
      containers:
      - name: web
        image: localhost/receitas-toon:1.0
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: receitas-config
        - secretRef:
            name: receitas-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: receitas-web
spec:
  type: NodePort
  selector:
    app: receitas-web
  ports:
  - port: 80
    targetPort: 5000